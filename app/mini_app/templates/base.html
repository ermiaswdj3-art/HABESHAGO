<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}HABESHAGO{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">

    <!--
        Telegram Mini App SDK

        Provides the signed Telegram WebApp initData
        required by the HABESHAGO authentication
        boundary.

        The server remains responsible for validating
        that signed initData before trusting passenger
        identity.
    -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
    (function () {
        const root = document.documentElement;

        root.dataset.theme = "light";

        const telegram =
            window.Telegram &&
            window.Telegram.WebApp;

        if (!telegram) {
            return;
        }

        telegram.ready();

        try {
            telegram.setHeaderColor("#F6F8F7");
        } catch (error) {
            console.debug(
                "Telegram header color unavailable:",
                error
            );
        }

        try {
            telegram.setBackgroundColor("#F6F8F7");
        } catch (error) {
            console.debug(
                "Telegram background color unavailable:",
                error
            );
        }

        try {
            telegram.setBottomBarColor("#F6F8F7");
        } catch (error) {
            console.debug(
                "Telegram bottom bar color unavailable:",
                error
            );
        }
    }());
</script>

    {% block head %}{% endblock %}

</head>

<body>

<div id="app">

    <header>
        <h1>{{ page.layout.header.title }}</h1>
        <p>{{ page.layout.header.subtitle }}</p>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>

        <nav>

            <a href="/"
               class="nav-link {% if active_page == 'home' %}nav-link-active{% endif %}">
                🏠 Home
            </a>

            <a href="/passenger"
               class="nav-link {% if active_page == 'passenger' %}nav-link-active{% endif %}">
                🚖 My Trips
            </a>

            <a href="/driver"
               class="nav-link {% if active_page == 'driver' %}nav-link-active{% endif %}">
                👤 Profile
            </a>

        </nav>

    </footer>

</div>

{% block scripts %}{% endblock %}

</body>

</html>
